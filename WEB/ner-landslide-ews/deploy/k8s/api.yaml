apiVersion: apps/v1
kind: Deployment
metadata: {name: ews-api, namespace: landslide-ews}
spec:
  replicas: 3
  selector: {matchLabels: {app: ews-api}}
  template:
    metadata: {labels: {app: ews-api}}
    spec:
      containers:
        - name: api
          image: registry.example.com/ews-api:latest
          ports: [{containerPort: 8000}]
          envFrom: [{secretRef: {name: ews-secrets}}]
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits:   {cpu: "1",    memory: "1Gi"}
          readinessProbe:
            httpGet: {path: /api/health, port: 8000}
---
apiVersion: v1
kind: Service
metadata: {name: ews-api, namespace: landslide-ews}
spec:
  selector: {app: ews-api}
  ports: [{port: 80, targetPort: 8000}]